<link rel="stylesheet" href="assets/css/style.css"></head><body>
<div class="spot" aria-hidden="true"></div>
<header class="top"><a class="logo" href="index.html">NOVA<b>FORGE</b></a>
<button class="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
<nav><a href="index.html">Home</a><a href="projects.html">Projects</a><a href="contact.html" class=active aria-current=page>Contact</a><a class="btn sm" href="contact.html">Start a Project</a></nav></header>
<main><section class="wrap pt"><h1 class="rv">LET'S BUILD SOMETHING<br><span class="grad">EXTRAORDINARY.</span></h1>
<p class="lead rv">Tell us about your idea. Your request goes straight to the studio owner's Telegram.</p>
<form id="lead" class="glass" novalidate>
<label>Name *<input name="name" required maxlength="80" autocomplete="name"></label>
<label>Email *<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
<label>Telegram<input name="telegram" maxlength="40" placeholder="@username"></label>
<label>Phone<input name="phone" type="tel" maxlength="30"></label>
<label>Preferred contact<select name="method"><option>Telegram</option><option>Email</option><option>Phone</option></select></label>
<label>Project type<select name="type"><option>Game Development</option><option>Browser Game</option><option>Bot</option><option>Web Development</option><option>Interactive Experience</option><option>Other</option></select></label>
<label>Budget<input name="budget" maxlength="60"></label>
<label>Timeline<input name="deadline" maxlength="60"></label>
<label class="full">Project description *<textarea name="message" rows="5" required minlength="20" maxlength="2000"></textarea></label>
<input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="chk full"><input type="checkbox" name="consent" required> I agree to the processing of my personal data. *</label>
<p class="err full" id="err" role="alert"></p>
<button class="btn full" id="send" type="submit">Send request</button></form></section>
<div id="toast" role="status" aria-live="polite"></div></main>
